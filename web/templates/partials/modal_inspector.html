<!-- Universal Modal for Job Details & Artifact Previews Partial -->
<div id="modal-container" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-[#0d121f] border border-white/[0.1] rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
    <div class="p-4 border-b border-white/[0.08] flex items-center justify-between bg-[#07090e]">
      <div class="flex items-center gap-2">
        <i data-lucide="file-search" class="w-4 h-4 text-cyan-400"></i>
        <h3 id="modal-title" class="font-bold text-white text-sm truncate max-w-xl">Job Inspection</h3>
      </div>
      <button id="modal-close-btn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    
    <!-- Modal Navigation Tabs -->
    <div class="flex border-b border-white/[0.08] bg-[#090d16] px-4 pt-2 gap-2 text-xs">
      <button class="modal-tab active px-3 py-1.5 font-semibold text-cyan-400 border-b-2 border-cyan-400" data-target="modal-tab-details">Overview & JD</button>
      <button class="modal-tab px-3 py-1.5 font-medium text-slate-400 hover:text-slate-200" data-target="modal-tab-eval">7-Block Rubric</button>
      <button class="modal-tab px-3 py-1.5 font-medium text-slate-400 hover:text-slate-200" data-target="modal-tab-artifacts">Tailored Artifacts</button>
    </div>

    <div id="modal-body" class="p-6 overflow-y-auto space-y-4 text-xs">
      <!-- Dynamic modal content injected by modal.js -->
    </div>
  </div>
</div>
