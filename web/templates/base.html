<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}OperonJobHuntAI — Autonomous Mission Control{% endblock %}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN + Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              950: '#082f49',
            },
            oled: {
              main: '#07090e',
              card: '#0d121f',
              hover: '#131b2e',
              border: 'rgba(255, 255, 255, 0.08)',
            }
          }
        }
      }
    }
  </script>

  <!-- PixiJS v7 2D WebGL Renderer for Factory Visualization -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Modular Master Stylesheet -->
  <link rel="stylesheet" href="/static/css/main.css" />
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#07090e] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Top Navigation Header Partial -->
  {% include "partials/header.html" %}

  <!-- 6-Tab Navigation Bar Partial -->
  {% include "partials/nav.html" %}

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Universal Modal for Job Details & Artifact Previews Partial -->
  {% include "partials/modal_inspector.html" %}

  <!-- Toast Notification Stack -->
  <div id="toast-container"></div>

  <!-- Main Application Logic (Modular ES Module Entrypoint) -->
  <script type="module" src="/static/js/app.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
