[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careergraph-ai"
version = "0.1.0"
description = "Autonomous Agentic Job Search, Evaluation, GraphRAG Tailoring & Persistent Playwright Submitter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CareerGraph-AI Authors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "playwright>=1.43.0",
    "playwright-stealth>=1.0.6",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "networkx>=3.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
