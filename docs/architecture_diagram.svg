  </g>
  <text x="610.0" y="893" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Recall Memory (SQLite Ledger)</text>
  <text x="610.0" y="917" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Append-Only Applications, Q&amp;A Cache, SqliteSaver WAL</text>
