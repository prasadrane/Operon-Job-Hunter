    <ellipse cx="1350.0" cy="965" rx="170.0" ry="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <ellipse cx="1350.0" cy="859" rx="170.0" ry="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  </g>
  <text x="1350.0" y="893" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Playwright Browser Profile</text>
  <text x="1350.0" y="917" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Persistent Session Cookies, Storage State &amp; Evasions</text>

