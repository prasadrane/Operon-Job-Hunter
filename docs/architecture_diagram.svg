  <rect x="420" y="598" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="480" y="611" font-size="11" font-weight="600" font-style="italic" fill="#b45309" text-anchor="middle">consensus vote</text>
  <polyline points="850,570 850,605 680,605 680,645" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-llm)" />
  <rect x="660" y="598" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="720" y="611" font-size="11" font-weight="600" font-style="italic" fill="#b45309" text-anchor="middle">evaluator-optimizer</text>
  <polyline points="950,570 950,605 1150,605 1150,645" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow-write)" />
  <rect x="1040" y="598" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="1100" y="611" font-size="11" font-weight="600" font-style="italic" fill="#6d28d9" text-anchor="middle">compile AST</text>
  <polyline points="130,570 130,845" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-read)" />
  <rect x="70" y="800" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="130" y="813" font-size="11" font-weight="600" font-style="italic" fill="#0369a1" text-anchor="middle">verify H-1B</text>
  <polyline points="610,570 610,845" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow-write)" />
  <rect x="550" y="800" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="610" y="813" font-size="11" font-weight="600" font-style="italic" fill="#6d28d9" text-anchor="middle">persist score</text>
  <polyline points="980,570 980,845" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-read)" />
  <rect x="920" y="800" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="980" y="813" font-size="11" font-weight="600" font-style="italic" fill="#0369a1" text-anchor="middle">Multi-Hop GraphRAG</text>
  <polyline points="1350,570 1350,845" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-read)" />
  <rect x="1290" y="800" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="1350" y="813" font-size="11" font-weight="600" font-style="italic" fill="#0369a1" text-anchor="middle">session cookies</text>

  <!-- COMPONENT BOXES -->
  <!-- Box web_ui -->
  <rect x="80" y="115" width="430" height="95" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="295.0" y="153" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Mission Control 2.0 (Web &amp; D3)</text>
  <text x="295.0" y="177" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">FastAPI REST + Live SSE Telemetry + D3 Graph</text>
  <!-- Box cli_main -->
  <rect x="550" y="115" width="430" height="95" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="765.0" y="153" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Unified CLI Controller</text>
  <text x="765.0" y="177" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Daemon, Scanner, Evaluator &amp; Playwright Submitter</text>
  <!-- Box telegram_hitl -->
  <rect x="1020" y="115" width="480" height="95" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="1260.0" y="153" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Telegram HITL Approval Bot</text>
  <text x="1260.0" y="177" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Interactive Cards, PDF Previews &amp; Approval Signals</text>
  <!-- Box langgraph_dag -->
  <rect x="80" y="295" width="430" height="95" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
  <text x="295.0" y="333" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">LangGraph StateGraph DAG</text>
  <text x="295.0" y="357" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">5-Stage Typed Pipeline &amp; Conditional Routing</text>
  <!-- Box circuit_breaker -->
  <rect x="550" y="295" width="430" height="95" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
  <text x="765.0" y="333" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Execution Circuit Breakers</text>
  <text x="765.0" y="357" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Bounded Worker Threads, 45s Timeout Budgets</text>
  <!-- Box hitl_gate -->
  <rect x="1020" y="295" width="480" height="95" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
  <text x="1260.0" y="333" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Dynamic interrupt() Gate</text>
  <text x="1260.0" y="357" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Pre-Submission Checkpoint &amp; Command(resume) Engine</text>
