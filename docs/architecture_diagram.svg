  <text x="237.5" y="513" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Discovery Squad (9 Crawlers)</text>
  <text x="237.5" y="537" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Deferred Tool Search &amp; USCIS H-1B Verification</text>
  <!-- Box eval_guard -->
  <rect x="435" y="475" width="335" height="95" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8" filter="url(#shadow)" />
  <text x="602.5" y="513" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">7-Block Evaluator &amp; Work Auth</text>
  <text x="602.5" y="537" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Multi-Model Consensus Voting &amp; Ghost-Job Filter</text>
  <!-- Box tailor_optimizer -->
  <rect x="800" y="475" width="335" height="95" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8" filter="url(#shadow)" />
  <text x="967.5" y="513" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">GraphRAG Evaluator-Optimizer</text>
  <text x="967.5" y="537" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">3-Persona Critic &amp; Surgical Delta Patching</text>
  <!-- Box websurfer_sub -->
  <rect x="1165" y="475" width="355" height="95" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8" filter="url(#shadow)" />
  <text x="1342.5" y="513" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">WebSurfer Agent &amp; FastPath</text>
  <text x="1342.5" y="537" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">AXTree + Set-of-Marks, Quiescence &amp; Form Healing</text>
  <!-- Box llm_gateway -->
  <rect x="80" y="645" width="780" height="105" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)" />
  <text x="470.0" y="677" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">LLM Gateway &amp; Model Tiering Router</text>
  <text x="470.0" y="697" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Tiered Routing: Gemini Flash (S1/2/4) &amp; Gemini Pro (S3)</text>
  <!-- Box pdf_compiler -->
  <rect x="900" y="645" width="620" height="105" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#shadow)" />
  <text x="1210.0" y="683" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Deterministic Compiler &amp; Page Gate</text>
  <text x="1210.0" y="707" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">ReportLab / Typst Engine + Strict 1-Page / 2-Page Layout Bounds</text>
