<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" style="background-color: #ffffff; font-family: Segoe UI, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-req" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-llm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <marker id="arrow-write" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6d28d9" />
    </marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369a1" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- DIAGRAM TITLE -->
  <text x="80" y="42" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">CareerGraph-AI — System Architecture &amp; Agentic Operating System</text>
  <text x="80" y="62" font-size="13" font-weight="500" fill="#64748b">Production Architecture: 5-Stage LangGraph DAG, 3-Tier OS Memory, AXTree Grounding &amp; Multi-Model Consensus</text>

  <!-- LAYER SWIMLANES -->
  <!-- Band L1 -->
  <rect x="50" y="75" width="1500" height="155" rx="12" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="75" y="95" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.5px">1. INTERFACE &amp; HUMAN-IN-THE-LOOP CHANNELS</text>
  <!-- Band L2 -->
  <rect x="50" y="255" width="1500" height="155" rx="12" fill="#ecfdf5" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="75" y="275" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.5px">2. MACRO ORCHESTRATION &amp; STATE MACHINE (LANGGRAPH)</text>
  <!-- Band L3 -->
  <rect x="50" y="435" width="1500" height="155" rx="12" fill="#fffbeb" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="75" y="455" font-size="13" font-weight="700" fill="#b45309" letter-spacing="0.5px">3. SPECIALIZED MICRO-AGENTS &amp; ENGINES</text>
  <!-- Band L4 -->
  <rect x="50" y="615" width="1500" height="155" rx="12" fill="#f5f3ff" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="75" y="635" font-size="13" font-weight="700" fill="#7c3aed" letter-spacing="0.5px">4. REASONING ENGINE &amp; COMPILER GATES</text>
  <!-- Band L5 -->
  <rect x="50" y="795" width="1500" height="195" rx="12" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="75" y="815" font-size="13" font-weight="700" fill="#0284c7" letter-spacing="0.5px">5. 3-TIER OS MEMORY &amp; PERSISTENT DATA STORES</text>

  <!-- EDGES / CONNECTIONS -->
  <polyline points="295,210 295,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="235" y="240" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="295" y="253" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">invoke pipeline</text>
  <polyline points="765,210 765,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="705" y="240" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="765" y="253" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">CLI batch run</text>
  <polyline points="1260,295 1260,210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="1200" y="240" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="1260" y="253" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">interrupt() alert</text>
  <polyline points="180,390 180,475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="120" y="425" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="180" y="438" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">Stage 1</text>
  <polyline points="350,390 350,430 510,430 510,475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="450" y="425" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="510" y="438" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">Stage 2</text>
  <polyline points="820,390 820,430 920,430 920,475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="860" y="425" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="920" y="438" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">Stage 3 (bounded)</text>
  <polyline points="1340,390 1340,475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-req)" />
  <rect x="1280" y="425" width="120" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
  <text x="1340" y="438" font-size="11" font-weight="600" font-style="italic" fill="#475569" text-anchor="middle">Stage 4 (approved)</text>
