services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careergraph-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - browser_data:/app/data/browser_profile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:15-alpine
    container_name: careergraph-db
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careergraph
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careergraph}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  browser_data:
